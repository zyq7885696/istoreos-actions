name: Build iStoreOS x86_64 EFI 纯净版

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
  schedule:
   - cron: 0 16 * * *

env:
  REPO_URL: https://github.com/istoreos/istoreos
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        REPO_BRANCH: [istoreos-22.03]
        ARCHITECTURE: [x86]
      fail-fast: false

    steps:
      - name:  Checkout
        uses: actions/checkout@main

      - name:  初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -qq
          sudo apt install -y $(cat depends/ubuntu-22.04)
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name:  克隆源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b ${{ matrix.REPO_BRANCH }} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name:  加载 feeds & diy1
        run: |
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name:  加载 diy2
        run: |
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name:  写入纯净配置（仅4插件 + 2G + EFI）
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048
          CONFIG_TARGET_ROOTFS_EXT4=y
          CONFIG_TARGET_ROOTFS_EFI_BOOT=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-docker=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_default-settings=y
          CONFIG_ALL_NONSHARED=n
          EOF

          mkdir -p files/etc/uci-defaults/
          cat > files/etc/uci-defaults/99-autoset << EOF
          #!/bin/sh
          uci set luci.main.lang=zh-cn
          uci set luci.main.mediaurlbase=/luci-static/argon
          uci commit luci

          passwd root <<EOF
          123456
          123456
          EOF

          uci set network.lan.ipaddr=192.168.2.1
          uci set network.lan.netmask=255.255.255.0
          uci delete network.lan.gateway
          uci delete network.lan.dns
          uci commit network

          uci set dhcp.lan.ignore=1
          uci set dhcp.lan.dhcp_option='3,192.168.2.1 6,192.168.2.1'
          uci commit dhcp

          uci set firewall.@zone[1].input=ACCEPT
          uci set firewall.@zone[1].forward=ACCEPT
          uci commit firewall

          cat > /etc/sysctl.d/99-bbr.conf <<EOF
          net.core.default_qdisc=fq
          net.ipv4.tcp_congestion_control=bbr
          EOF
          sysctl -p /etc/sysctl.d/99-bbr.conf

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-autoset

      - name:  下载依赖
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name:  编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name:  只保留 EFI 固件
        run: |
          cd openwrt/bin/targets/x86/64
          rm -rf packages
          rm -f *-combined.img.gz
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name:  上传并发布
        uses: softprops/action-gh-release@v1
        with:
          tag_name: $(date +"%Y.%m.%d-%H%M")-x64-EFI
          body: |
            架构：x86_64 EFI
            插件：iStore商店 + Docker + ZeroTier + DiskMan
            空间：2048MB
            地址：192.168.2.1
            密码：123456
            模式：旁路由
          files: ${{ env.FIRMWARE }}/*

      - name:  删除旧运行记录
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 1
