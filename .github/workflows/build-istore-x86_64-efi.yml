name: iStoreOS x86_64 EFI 纯净最小版（WEB+商店+Docker+ZeroTier+DiskMan）

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-22.03
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: 安装环境
        run: |
          sudo apt update -qq
          sudo apt install -y build-essential ccache libncurses5-dev libssl-dev \
          git gawk unzip python3 python3-pip wget gettext xsltp
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆源码
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt

      - name: 配置 feeds（必须，否则插件找不到）
        run: |
          cd openwrt
          sed -i 's/^#\(.*helloworld\)/\1/' feeds.conf.default
          echo "src-git istore https://github.com/linkease/istore;main" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入最小.config（只编译你要的，绝不丢包）
        run: |
          cd openwrt
          cat > .config << EOF
  CONFIG_TARGET_x86=y
  CONFIG_TARGET_x86_64=y
  CONFIG_TARGET_x86_64_DEVICE_generic=y
  CONFIG_TARGET_ROOTFS_PARTSIZE=2048
  CONFIG_TARGET_ROOTFS_EXT4=y
  CONFIG_TARGET_ROOTFS_EFI_BOOT=y

  # ========== WEB 管理页面（必须） ==========
  CONFIG_PACKAGE_luci=y
  CONFIG_PACKAGE_uhttpd=y
  CONFIG_PACKAGE_uhttpd-mod-ubus=y

  # ========== iStoreOS 首页 ==========
  CONFIG_PACKAGE_luci-app-index=y

  # ========== 网络配置 ==========
  CONFIG_PACKAGE_luci-app-network=y

  # ========== iStore 商店 ==========
  CONFIG_PACKAGE_luci-app-store=y

  # ========== Docker ==========
  CONFIG_PACKAGE_luci-app-docker=y
  CONFIG_PACKAGE_docker-compose=y
  CONFIG_PACKAGE_dockerd=y

  # ========== ZeroTier ==========
  CONFIG_PACKAGE_luci-app-zerotier=y
  CONFIG_PACKAGE_zerotier=y

  # ========== DiskMan ==========
  CONFIG_PACKAGE_luci-app-diskman=y
  CONFIG_PACKAGE_lsblk=y
  CONFIG_PACKAGE_blkid=y
  CONFIG_PACKAGE_e2fsprogs=y

  # ========== 主题 ==========
  CONFIG_PACKAGE_luci-theme-argon=y

  # ========== 基础 ==========
  CONFIG_PACKAGE_default-settings=y
  CONFIG_ALL_NONSHARED=n
EOF

      - name: 自动配置脚本（IP 172.16.1.251）
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults/
          cat > files/etc/uci-defaults/99-autoset << EOF
#!/bin/sh
/etc/init.d/uhttpd enable
/etc/init.d/uhttpd start

uci set luci.main.lang=zh-cn
uci set luci.main.mediaurlbase=/luci-static/argon
uci commit luci

passwd root <<PASS
123456
123456
PASS

uci set network.lan.proto=static
uci set network.lan.ipaddr=172.16.1.251
uci set network.lan.netmask=255.255.0.0
uci commit network

uci set dhcp.lan.ignore=1
uci commit dhcp

exit 0
EOF
          chmod +x files/etc/uci-defaults/99-autoset

      - name: 下载 & 编译
        run: |
          cd openwrt
          make defconfig
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: 提取 EFI 固件
        run: |
          cd openwrt/bin/targets/x86/64
          rm -rf packages
          rm -f *-combined.img.gz
          echo "FIRMWARE=\$PWD" >> \$GITHUB_ENV

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-x86_64-EFI
          path: openwrt/bin/targets/x86/64/*efi.img.gz
